
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenix AI - Pseudos Gaming</title>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif;text-align:center;padding:25px 15px}
main{max-width:600px;margin:45px auto;background:#151c32;padding:25px;border-radius:20px}
h1{font-size:42px;color:#a78bfa}
p{color:#cbd5e1;line-height:1.5}
input,select,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:10px;font-size:16px}
input,select{background:#0b1020;color:white;border:1px solid #475569}
button{background:#7c3aed;color:white;border:0;font-weight:bold;cursor:pointer}
.result{background:#222b45;padding:12px;margin-top:10px;border-radius:9px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.result button{width:auto;margin:0;padding:8px}
</style>
</head>
<body>
<main>
<h1>ZENIX AI ⚡</h1>
<p>Le générateur de pseudos gaming !</p>
<input id="word" placeholder="Ton mot préféré (facultatif)">
<select id="style">
<option value="tryhard">⚡ Tryhard</option>
<option value="pro">👑 Pro</option>
<option value="future">🌌 Futuriste</option>
<option value="fun">😈 Fun</option>
</select>
<select id="game">
<option value="FN">Fortnite</option>
<option value="RBX">Roblox</option>
<option value="RL">Rocket League</option>
<option value="YT">YouTube</option>
</select>
<button onclick="generate()">✨ GÉNÉRER MES PSEUDOS</button>
<div id="results"></div>
</main>
<script>
function generate(){
const word=document.getElementById('word').value.trim().replace(/[^a-zA-Z0-9_]/g,'').slice(0,12);
const style=document.getElementById('style').value;
const game=document.getElementById('game').value;
const prefixes={
tryhard:['Vex','Clutch','Rush','Flick','Zerq'],
pro:['Prime','Elite','Royal','Ace','Legend'],
future:['Nova','Void','Neon','Cyber','Orbit'],
fun:['Panda','Mochi','Pixel','Waffle','ZigZag']
};
const suffixes=['X','ツ','YT','GG','Pro','7','_FN','404'];
const out=new Set();
while(out.size<8){
const a=prefixes[style][Math.floor(Math.random()*prefixes[style].length)];
const b=suffixes[Math.floor(Math.random()*suffixes.length)];
const n=[a+word+b,word+a,a+b+game,a+'_'+game,word+b,a+word][Math.floor(Math.random()*6)];
if(n.length>1)out.add(n.slice(0,20));
}
document.getElementById('results').innerHTML=[...out].map(n=>'<div class="result"><strong>'+n+'</strong><button onclick="copyName(this)">Copier</button></div>').join('');
}
function copyName(btn){
const name=btn.parentElement.querySelector('strong').textContent;
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(name).then(()=>btn.textContent='Copié !').catch(()=>prompt('Copie ce pseudo :',name));
}else{prompt('Copie ce pseudo :',name)}
}
</script>
</body>
</html>
